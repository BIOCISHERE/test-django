{% load django_bootstrap5 %}
<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}EcoEnergy{% endblock %}</title>
        {% bootstrap_css %}
        <style>
            body {
                background: #f4f7fb;
            }
        </style>
    </head>
    <body class="bg-light">
        <div class="container py-4">
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded shadow-sm mb-4">
                <div class="container-fluid">
                    <a class="navbar-brand fw-bold" href="{% url 'dispositivos:inicio' %}">EcoEnergy</a>
                    <div class="navbar-nav ms-auto">
                        <a
                            class="nav-link {% if request.resolver_match.view_name == 'dispositivos:inicio' %}active{% endif %}"
                            href="{% url 'dispositivos:inicio' %}"
                        >
                            Inicio
                        </a>
                        <a
                            class="nav-link {% if request.resolver_match.view_name == 'dispositivos:catalogo' %}active{% endif %}"
                            href="{% url 'dispositivos:catalogo' %}"
                        >
                            Dispositivos
                        </a>
                        <a
                            class="nav-link {% if request.resolver_match.view_name == 'dispositivos:zonas' %}active{% endif %}"
                            href="{% url 'dispositivos:zonas' %}"
                        >
                            Zonas
                        </a>
                    </div>
                </div>
            </nav>
            <main>{% block content %}{% endblock %}</main>
        </div>
        {% bootstrap_javascript %}
    </body>
</html>
